<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="PR and press conference microphones">
<title>PR and press conference microphones</title>
<defs>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3B30"/><stop offset=".55" stop-color="#E10600"/><stop offset="1" stop-color="#8E0400"/></linearGradient>
<linearGradient id="redH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9E0500"/><stop offset=".5" stop-color="#FF2A1F"/><stop offset="1" stop-color="#9E0500"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3BE38F"/><stop offset=".5" stop-color="#0B9A50"/><stop offset="1" stop-color="#04502A"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A524E"/><stop offset=".45" stop-color="#232826"/><stop offset="1" stop-color="#0E1110"/></linearGradient>
<linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1110"/><stop offset=".35" stop-color="#3C4440"/><stop offset=".5" stop-color="#5B6560"/><stop offset=".65" stop-color="#2A302D"/><stop offset="1" stop-color="#0E1110"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F5"/><stop offset=".5" stop-color="#9AA39F"/><stop offset="1" stop-color="#E6EAE8"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A1D"/><stop offset=".6" stop-color="#07140E"/><stop offset="1" stop-color="#160505"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DEDB"/></linearGradient>
<radialGradient id="glowR"><stop offset="0" stop-color="#FF2A1F" stop-opacity=".9"/><stop offset="1" stop-color="#FF2A1F" stop-opacity="0"/></radialGradient>
<radialGradient id="glowG"><stop offset="0" stop-color="#2FCB7C" stop-opacity=".85"/><stop offset="1" stop-color="#2FCB7C" stop-opacity="0"/></radialGradient>
<radialGradient id="glowW"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="beamR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3B30" stop-opacity=".8"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></linearGradient>
<linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FCB7C" stop-opacity=".8"/><stop offset="1" stop-color="#2FCB7C" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<style>
[class]{transform-box:fill-box}
.orb{transform-box:view-box}
.bars rect,.conf rect{transform-box:fill-box}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6.5s ease-in-out -2s infinite}
.float3{animation:float 4.2s ease-in-out -1s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
.pulse{transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.spin{transform-origin:center;animation:spin 14s linear infinite}
.spinR{transform-origin:center;animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}

.ring{transform-origin:center;animation:ring 2.6s ease-out infinite;opacity:0}
.r2{animation-delay:.85s}.r3{animation-delay:1.7s}
@keyframes ring{0%{opacity:.85;transform:scale(.5)}100%{opacity:0;transform:scale(1.35)}}
.flash{transform-origin:center;animation:flash 3.4s ease-out infinite;opacity:0}
.f2{animation-delay:-1.2s}.f3{animation-delay:-2.3s}
@keyframes flash{0%,82%{opacity:0;transform:scale(.4)}86%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.6)}}
.card{animation:float 4.6s ease-in-out infinite}
.c2{animation-delay:-1.5s}.c3{animation-delay:-3s}
</style>

<ellipse cx="300" cy="556" rx="200" ry="20" fill="url(#shadow)"/>
<!-- sound rings -->
<g fill="none" stroke-width="5">
  <circle class="ring" cx="300" cy="150" r="110" stroke="#E10600"/>
  <circle class="ring r2" cx="300" cy="150" r="110" stroke="#2FCB7C"/>
  <circle class="ring r3" cx="300" cy="150" r="110" stroke="#fff"/>
</g>
<!-- podium -->
<path d="M190 330 h220 l-18 220 H208z" fill="url(#metal)" stroke="#4A524E" stroke-width="2"/>
<rect x="176" y="316" width="248" height="22" rx="6" fill="url(#metalH)"/>
<rect x="214" y="374" width="172" height="90" rx="8" fill="url(#red)"/>
<text x="300" y="414" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#fff" letter-spacing="2">PRESS</text>
<text x="300" y="444" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#fff" opacity=".9">BRIEFING</text>
<rect x="214" y="374" width="50" height="90" fill="url(#sheen)" class="sweep"/>
<!-- microphones -->
<g transform="translate(300 322) rotate(-38)">
  <rect x="-4" y="-120" width="8" height="120" rx="4" fill="#2A302D"/>
  <rect x="-20" y="-150" width="40" height="30" rx="6" fill="url(#red)" stroke="#0A0C0B" stroke-opacity=".3"/>
  <rect x="-12" y="-184" width="24" height="36" rx="5" fill="#1B201E"/>
  <ellipse cx="0" cy="-196" rx="19" ry="22" fill="#121614"/>
  <ellipse cx="0" cy="-196" rx="15" ry="18" fill="none" stroke="#4A524E" stroke-width="2" stroke-dasharray="2 3"/>
  <ellipse cx="-6" cy="-204" rx="4" ry="6" fill="#fff" opacity=".25"/>
</g>
<g transform="translate(300 322) rotate(-19)">
  <rect x="-4" y="-120" width="8" height="120" rx="4" fill="#2A302D"/>
  <rect x="-20" y="-150" width="40" height="30" rx="6" fill="#fff" stroke="#0A0C0B" stroke-opacity=".3"/>
  <rect x="-12" y="-184" width="24" height="36" rx="5" fill="#1B201E"/>
  <ellipse cx="0" cy="-196" rx="19" ry="22" fill="#121614"/>
  <ellipse cx="0" cy="-196" rx="15" ry="18" fill="none" stroke="#4A524E" stroke-width="2" stroke-dasharray="2 3"/>
  <ellipse cx="-6" cy="-204" rx="4" ry="6" fill="#fff" opacity=".25"/>
</g>
<g transform="translate(300 322) rotate(0)">
  <rect x="-4" y="-120" width="8" height="120" rx="4" fill="#2A302D"/>
  <rect x="-20" y="-150" width="40" height="30" rx="6" fill="url(#green)" stroke="#0A0C0B" stroke-opacity=".3"/>
  <rect x="-12" y="-184" width="24" height="36" rx="5" fill="#1B201E"/>
  <ellipse cx="0" cy="-196" rx="19" ry="22" fill="#121614"/>
  <ellipse cx="0" cy="-196" rx="15" ry="18" fill="none" stroke="#4A524E" stroke-width="2" stroke-dasharray="2 3"/>
  <ellipse cx="-6" cy="-204" rx="4" ry="6" fill="#fff" opacity=".25"/>
</g>
<g transform="translate(300 322) rotate(19)">
  <rect x="-4" y="-120" width="8" height="120" rx="4" fill="#2A302D"/>
  <rect x="-20" y="-150" width="40" height="30" rx="6" fill="url(#red)" stroke="#0A0C0B" stroke-opacity=".3"/>
  <rect x="-12" y="-184" width="24" height="36" rx="5" fill="#1B201E"/>
  <ellipse cx="0" cy="-196" rx="19" ry="22" fill="#121614"/>
  <ellipse cx="0" cy="-196" rx="15" ry="18" fill="none" stroke="#4A524E" stroke-width="2" stroke-dasharray="2 3"/>
  <ellipse cx="-6" cy="-204" rx="4" ry="6" fill="#fff" opacity=".25"/>
</g>
<g transform="translate(300 322) rotate(38)">
  <rect x="-4" y="-120" width="8" height="120" rx="4" fill="#2A302D"/>
  <rect x="-20" y="-150" width="40" height="30" rx="6" fill="#fff" stroke="#0A0C0B" stroke-opacity=".3"/>
  <rect x="-12" y="-184" width="24" height="36" rx="5" fill="#1B201E"/>
  <ellipse cx="0" cy="-196" rx="19" ry="22" fill="#121614"/>
  <ellipse cx="0" cy="-196" rx="15" ry="18" fill="none" stroke="#4A524E" stroke-width="2" stroke-dasharray="2 3"/>
  <ellipse cx="-6" cy="-204" rx="4" ry="6" fill="#fff" opacity=".25"/>
</g>
<!-- flying press cards -->
<g class="card"><rect x="40" y="90" width="120" height="78" rx="10" fill="url(#white)"/><rect x="40" y="90" width="120" height="22" rx="10" fill="url(#red)"/><text x="52" y="106" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff">NEWS</text><g stroke="#9AA39F" stroke-width="5" stroke-linecap="round"><line x1="54" y1="128" x2="146" y2="128"/><line x1="54" y1="142" x2="130" y2="142"/><line x1="54" y1="156" x2="140" y2="156"/></g></g>
<g class="card c2"><path d="M440 80 h120 a12 12 0 0 1 12 12 v52 a12 12 0 0 1 -12 12 h-74 l-22 20 v-20 h-24 a12 12 0 0 1 -12 -12 v-52 a12 12 0 0 1 12 -12z" fill="url(#green)"/><text x="470" y="132" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#fff">“ ”</text></g>
<g class="card c3"><rect x="456" y="380" width="110" height="74" rx="12" fill="url(#metal)" stroke="#4A524E"/><circle cx="511" cy="418" r="22" fill="#121614" stroke="#9AA39F" stroke-width="3"/><circle cx="511" cy="418" r="11" fill="#1E4E7A"/><rect x="470" y="370" width="30" height="12" rx="3" fill="#2A302D"/></g>
<g class="card c2"><rect x="30" y="380" width="120" height="44" rx="22" fill="url(#red)"/><text x="52" y="408" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800" fill="#fff">ON AIR ●</text></g>
<!-- camera flashes -->
<circle class="flash" cx="511" cy="390" r="46" fill="url(#glowW)"/>
<circle class="flash f2" cx="96" cy="300" r="40" fill="url(#glowW)"/>
<circle class="flash f3" cx="520" cy="250" r="34" fill="url(#glowW)"/>

</svg>
