<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="TVC production cinema camera">
<title>TVC production cinema camera</title>
<defs>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3B30"/><stop offset=".55" stop-color="#E10600"/><stop offset="1" stop-color="#8E0400"/></linearGradient>
<linearGradient id="redH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9E0500"/><stop offset=".5" stop-color="#FF2A1F"/><stop offset="1" stop-color="#9E0500"/></linearGradient>
<linearGradient id="green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3BE38F"/><stop offset=".5" stop-color="#0B9A50"/><stop offset="1" stop-color="#04502A"/></linearGradient>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A524E"/><stop offset=".45" stop-color="#232826"/><stop offset="1" stop-color="#0E1110"/></linearGradient>
<linearGradient id="metalH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0E1110"/><stop offset=".35" stop-color="#3C4440"/><stop offset=".5" stop-color="#5B6560"/><stop offset=".65" stop-color="#2A302D"/><stop offset="1" stop-color="#0E1110"/></linearGradient>
<linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F5"/><stop offset=".5" stop-color="#9AA39F"/><stop offset="1" stop-color="#E6EAE8"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A1D"/><stop offset=".6" stop-color="#07140E"/><stop offset="1" stop-color="#160505"/></linearGradient>
<linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9DEDB"/></linearGradient>
<radialGradient id="glowR"><stop offset="0" stop-color="#FF2A1F" stop-opacity=".9"/><stop offset="1" stop-color="#FF2A1F" stop-opacity="0"/></radialGradient>
<radialGradient id="glowG"><stop offset="0" stop-color="#2FCB7C" stop-opacity=".85"/><stop offset="1" stop-color="#2FCB7C" stop-opacity="0"/></radialGradient>
<radialGradient id="glowW"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
<radialGradient id="shadow"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
<linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".75"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<linearGradient id="beamR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF3B30" stop-opacity=".8"/><stop offset="1" stop-color="#FF3B30" stop-opacity="0"/></linearGradient>
<linearGradient id="beamG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2FCB7C" stop-opacity=".8"/><stop offset="1" stop-color="#2FCB7C" stop-opacity="0"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="blur6" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="blur14" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>
<style>
[class]{transform-box:fill-box}
.orb{transform-box:view-box}
.bars rect,.conf rect{transform-box:fill-box}
.float{animation:float 5s ease-in-out infinite}
.float2{animation:float 6.5s ease-in-out -2s infinite}
.float3{animation:float 4.2s ease-in-out -1s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes blink{0%,55%{opacity:1}56%,100%{opacity:.15}}
.pulse{transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.92)}50%{opacity:1;transform:scale(1.06)}}
.spin{transform-origin:center;animation:spin 14s linear infinite}
.spinR{transform-origin:center;animation:spin 22s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.sweep{animation:sweep 4.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}55%,100%{transform:translateX(220%)}}

.rec{animation:blink 1.1s steps(1) infinite}
.flare{transform-origin:center;animation:flare 3.6s ease-in-out infinite}
@keyframes flare{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.beam{animation:beamf 3.6s ease-in-out infinite}
@keyframes beamf{0%,100%{opacity:.35}50%{opacity:.85}}
.ring{animation:ringm 3s linear infinite}
@keyframes ringm{to{stroke-dashoffset:-48}}
.bars rect{transform-origin:bottom;animation:bar 1.6s ease-in-out infinite}
.bars rect:nth-child(2){animation-delay:-.4s}.bars rect:nth-child(3){animation-delay:-.8s}.bars rect:nth-child(4){animation-delay:-1.2s}
@keyframes bar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.clap{transform-origin:0% 100%;animation:clap 3.2s ease-in-out infinite}
@keyframes clap{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-22deg)}86%{transform:rotate(0)}}
</style>

<ellipse cx="300" cy="560" rx="210" ry="22" fill="url(#shadow)"/>
<!-- light beam from the lens -->
<polygon class="beam" points="478,210 600,150 600,345 478,288" fill="url(#beam)" opacity=".6" filter="url(#soft)"/>
<g class="float">
  <!-- tripod -->
  <g stroke-linecap="round">
    <line x1="300" y1="350" x2="178" y2="548" stroke="#1B201E" stroke-width="16"/>
    <line x1="300" y1="350" x2="178" y2="548" stroke="#4A524E" stroke-width="5"/>
    <line x1="300" y1="350" x2="422" y2="548" stroke="#1B201E" stroke-width="16"/>
    <line x1="300" y1="350" x2="422" y2="548" stroke="#4A524E" stroke-width="5"/>
    <line x1="300" y1="350" x2="300" y2="556" stroke="#121614" stroke-width="14"/>
    <line x1="232" y1="470" x2="368" y2="470" stroke="#2A302D" stroke-width="6"/>
    <circle cx="178" cy="548" r="9" fill="#E10600"/><circle cx="422" cy="548" r="9" fill="#E10600"/><circle cx="300" cy="556" r="9" fill="#0B9A50"/>
  </g>
  <!-- fluid head + pan bar -->
  <rect x="258" y="318" width="84" height="40" rx="8" fill="url(#metal)"/>
  <rect x="266" y="326" width="68" height="6" rx="3" fill="#E10600"/>
  <line x1="262" y1="340" x2="150" y2="392" stroke="#1B201E" stroke-width="12" stroke-linecap="round"/>
  <line x1="262" y1="340" x2="150" y2="392" stroke="#5B6560" stroke-width="3" stroke-linecap="round"/>
  <!-- camera body -->
  <rect x="168" y="196" width="226" height="126" rx="14" fill="url(#metal)"/>
  <rect x="168" y="196" width="226" height="126" rx="14" fill="none" stroke="#5B6560" stroke-opacity=".5"/>
  <rect x="168" y="292" width="226" height="10" fill="#E10600"/>
  <!-- top handle -->
  <path d="M212 196 v-30 h132 v30" fill="none" stroke="#1B201E" stroke-width="14" stroke-linejoin="round"/>
  <path d="M212 196 v-30 h132 v30" fill="none" stroke="#4A524E" stroke-width="4" stroke-linejoin="round"/>
  <!-- side display -->
  <rect x="186" y="214" width="98" height="64" rx="6" fill="url(#screen)" stroke="#2FCB7C" stroke-opacity=".5"/>
  <g class="bars" fill="#2FCB7C"><rect x="196" y="244" width="10" height="26" rx="2"/><rect x="212" y="244" width="10" height="26" rx="2"/><rect x="228" y="244" width="10" height="26" rx="2"/><rect x="244" y="244" width="10" height="26" rx="2"/></g>
  <text x="196" y="234" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="1">4K · 25P</text>
  <circle class="rec" cx="270" cy="230" r="6" fill="#FF2A1F"/>
  <!-- buttons -->
  <circle cx="306" cy="228" r="8" fill="#2A302D" stroke="#5B6560"/><circle cx="332" cy="228" r="8" fill="#2A302D" stroke="#5B6560"/><circle cx="358" cy="228" r="8" fill="#0B9A50"/>
  <rect x="300" y="250" width="76" height="26" rx="5" fill="#121614"/>
  <text x="309" y="268" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#FF3B30">● REC</text>
  <!-- lens -->
  <rect x="392" y="214" width="34" height="92" rx="6" fill="url(#metal)"/>
  <rect x="424" y="206" width="54" height="108" rx="8" fill="url(#metalH)"/>
  <rect x="432" y="206" width="38" height="108" fill="none" stroke="#9AA39F" stroke-width="2" stroke-dasharray="3 5" class="ring"/>
  <rect x="440" y="206" width="6" height="108" fill="#E10600" opacity=".9"/>
  <!-- matte box -->
  <polygon points="478,198 528,176 528,344 478,322" fill="#121614" stroke="#4A524E"/>
  <ellipse cx="503" cy="260" rx="16" ry="58" fill="#0B1A2A"/>
  <ellipse cx="503" cy="260" rx="11" ry="44" fill="#1E4E7A" opacity=".8"/>
  <ellipse cx="499" cy="240" rx="4" ry="12" fill="#fff" opacity=".7"/>
  <circle class="flare" cx="512" cy="255" r="34" fill="url(#glowW)"/>
  <!-- top monitor on arm -->
  <line x1="236" y1="166" x2="214" y2="128" stroke="#2A302D" stroke-width="8" stroke-linecap="round"/>
  <rect x="150" y="76" width="118" height="70" rx="8" fill="#121614" stroke="#4A524E"/>
  <rect x="158" y="84" width="102" height="54" rx="4" fill="url(#red)"/>
  <polygon points="200,98 200,124 222,111" fill="#fff"/>
  <rect x="158" y="84" width="40" height="54" fill="url(#sheen)" class="sweep"/>
</g>
<!-- clapperboard -->
<g transform="translate(60 440)"><g class="float3">
  <rect x="0" y="22" width="96" height="66" rx="5" fill="#121614" stroke="#4A524E"/>
  <text x="10" y="52" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#fff">SCENE 01</text>
  <text x="10" y="72" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="800" fill="#2FCB7C">TAKE 03</text>
  <g class="clap"><rect x="0" y="4" width="96" height="18" rx="3" fill="#fff"/>
  <path d="M10 4 l12 18 M34 4 l12 18 M58 4 l12 18 M82 4 l12 18" stroke="#E10600" stroke-width="8"/></g>
</g></g>

</svg>
