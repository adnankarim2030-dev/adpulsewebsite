<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AdPulse - Hero Preview (Pulse Core)</title>
  <style>
    :root {
      --orange: #FF6B00;
      --charcoal: #111111;
      --bg: #050505;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      background-color: var(--bg); 
      font-family: 'Helvetica Neue', Arial, sans-serif; 
      overflow: hidden; 
      color: #fff; 
    }
    
    #canvas-container { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100vw; height: 100vh; 
      z-index: 1; 
    }
    
    .hero-ui { 
      position: absolute; 
      top: 0; left: 0; 
      width: 100vw; height: 100vh; 
      z-index: 2; 
      pointer-events: none;
      display: flex;
      align-items: center;
      padding: 0 10%;
    }

    .content {
      max-width: 600px;
      pointer-events: auto;
    }

    h1 {
      font-size: 5rem;
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: -2px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      font-size: 1.25rem;
      color: #ccc;
      line-height: 1.6;
      margin-bottom: 40px;
      max-width: 500px;
    }

    .cta-group {
      display: flex;
      gap: 20px;
    }

    .cta-primary {
      background: var(--orange);
      color: #fff;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border: 1px solid var(--orange);
      box-shadow: 0 10px 30px rgba(255, 107, 0, 0.3);
    }
    
    .cta-primary:hover {
      box-shadow: 0 10px 40px rgba(255, 107, 0, 0.6);
      transform: translateY(-2px);
    }

    .cta-secondary {
      background: transparent;
      color: #fff;
      padding: 16px 32px;
      border-radius: 30px;
      text-decoration: none;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .cta-secondary:hover {
      border-color: #fff;
    }

    @media (max-width: 768px) {
      .hero-ui { padding: 0 5%; text-align: center; justify-content: center; align-items: flex-start; padding-top: 15vh; }
      h1 { font-size: 3.5rem; }
      .content { display: flex; flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="hero-ui">
    <div class="content">
      <h1 id="hero-title">THE PULSE<br>OF BRANDS</h1>
      <p id="hero-desc">Where bold ideas, powerful media and creative technology come together to move brands forward.</p>
      <div class="cta-group" id="hero-ctas">
        <a href="#" class="cta-primary">Let's Create</a>
        <a href="#" class="cta-secondary">Explore Our Work</a>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <script>
    // === SCENE SETUP ===
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.04);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 15);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // === LIGHTING ===
    const ambientLight = new THREE.AmbientLight(0x222222);
    scene.add(ambientLight);

    const orangeLight = new THREE.PointLight(0xFF6B00, 3, 20);
    orangeLight.position.set(3, 0, 2);
    scene.add(orangeLight);

    const blueFill = new THREE.PointLight(0x112244, 1, 20);
    blueFill.position.set(-5, 5, 5);
    scene.add(blueFill);

    // === 3D OBJECTS ===
    const coreGroup = new THREE.Group();
    // Offset to right for desktop layout
    if(window.innerWidth > 768) {
        coreGroup.position.x = 4;
    } else {
        coreGroup.position.y = -3;
    }
    scene.add(coreGroup);

    // 1. The Pulse Orb
    const orbGeo = new THREE.IcosahedronGeometry(2, 4);
    const orbMat = new THREE.MeshPhysicalMaterial({
      color: 0x000000,
      emissive: 0xFF6B00,
      emissiveIntensity: 0.8,
      wireframe: true,
      transparent: true,
      opacity: 0.8
    });
    const orb = new THREE.Mesh(orbGeo, orbMat);
    coreGroup.add(orb);

    // Inner solid core
    const innerGeo = new THREE.SphereGeometry(1.8, 32, 32);
    const innerMat = new THREE.MeshStandardMaterial({
      color: 0x111111,
      roughness: 0.1,
      metalness: 0.8
    });
    const innerOrb = new THREE.Mesh(innerGeo, innerMat);
    coreGroup.add(innerOrb);

    // 2. Circular Rings
    for(let i=0; i<3; i++) {
      const ringGeo = new THREE.TorusGeometry(3 + (i*0.8), 0.02, 16, 100);
      const ringMat = new THREE.MeshBasicMaterial({ 
        color: 0xFF6B00, 
        transparent: true, 
        opacity: 0.3 - (i*0.1) 
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = Math.random() * Math.PI;
      ring.rotation.y = Math.random() * Math.PI;
      
      // Store custom rotation speed
      ring.userData = {
        rx: (Math.random() - 0.5) * 0.02,
        ry: (Math.random() - 0.5) * 0.02
      };
      
      coreGroup.add(ring);
    }

    // 3. Floating Abstract Elements (Media, Tech)
    const elementsGroup = new THREE.Group();
    coreGroup.add(elementsGroup);

    const geometries = [
      new THREE.BoxGeometry(0.8, 0.5, 0.1), // Screen/Billboard
      new THREE.CylinderGeometry(0.3, 0.3, 0.6, 32), // Camera Lens
      new THREE.TetrahedronGeometry(0.4), // Abstract Tech
      new THREE.OctahedronGeometry(0.3) // Data Node
    ];

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      metalness: 0.9,
      roughness: 0.1,
      transparent: true,
      opacity: 0.5,
      transmission: 0.9,
      ior: 1.5
    });

    for(let i=0; i<12; i++) {
      const geo = geometries[Math.floor(Math.random() * geometries.length)];
      const mesh = new THREE.Mesh(geo, glassMat);
      
      // Random spherical position
      const radius = 5 + Math.random() * 2;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos((Math.random() * 2) - 1);
      
      mesh.position.x = radius * Math.sin(phi) * Math.cos(theta);
      mesh.position.y = radius * Math.sin(phi) * Math.sin(theta);
      mesh.position.z = radius * Math.cos(phi);
      
      mesh.rotation.set(Math.random()*Math.PI, Math.random()*Math.PI, 0);
      
      mesh.userData = {
        speed: 0.002 + Math.random() * 0.005,
        axis: new THREE.Vector3(Math.random()-0.5, Math.random()-0.5, Math.random()-0.5).normalize()
      };
      
      elementsGroup.add(mesh);
    }

    // === MOUSE PARALLAX ===
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;
    const windowHalfX = window.innerWidth / 2;
    const windowHalfY = window.innerHeight / 2;

    document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - windowHalfX) * 0.001;
      mouseY = (e.clientY - windowHalfY) * 0.001;
    });

    // === UI ENTRANCE ANIMATION ===
    gsap.from("#hero-title", { opacity: 0, y: 50, duration: 1, delay: 0.2, ease: "power3.out" });
    gsap.from("#hero-desc", { opacity: 0, y: 30, duration: 1, delay: 0.4, ease: "power3.out" });
    gsap.from("#hero-ctas", { opacity: 0, y: 20, duration: 1, delay: 0.6, ease: "power3.out" });
    gsap.from(coreGroup.position, { z: -10, opacity: 0, duration: 2, ease: "power2.out" });

    // === RENDER LOOP ===
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Mouse Parallax easing
      targetX = mouseX * 2;
      targetY = mouseY * 2;
      
      coreGroup.rotation.y += 0.05 * (targetX - coreGroup.rotation.y);
      coreGroup.rotation.x += 0.05 * (targetY - coreGroup.rotation.x);

      // Orb pulsing
      orbMat.emissiveIntensity = 0.5 + Math.sin(time * 2) * 0.4;
      orb.rotation.y = time * 0.1;
      orb.rotation.z = time * 0.05;

      // Rings rotation
      coreGroup.children.forEach((child) => {
        if(child.geometry.type === 'TorusGeometry') {
          child.rotation.x += child.userData.rx;
          child.rotation.y += child.userData.ry;
        }
      });

      // Floating elements orbit
      elementsGroup.rotation.y = time * 0.05;
      elementsGroup.rotation.z = Math.sin(time * 0.1) * 0.1;

      elementsGroup.children.forEach((mesh) => {
        mesh.rotateOnAxis(mesh.userData.axis, 0.01);
      });

      renderer.render(scene, camera);
    }

    animate();

    // === RESIZE HANDLER ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      
      if(window.innerWidth > 768) {
          gsap.to(coreGroup.position, {x: 4, y: 0, duration: 0.5});
      } else {
          gsap.to(coreGroup.position, {x: 0, y: -3, duration: 0.5});
      }
    });

  </script>
</body>
</html>
